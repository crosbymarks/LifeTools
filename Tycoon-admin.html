<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tycoon Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

  <!-- Admin Login Gate -->
  <div id="adminLoginGate" class="max-w-md mx-auto mt-20 bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
    <div class="text-center mb-6">
      <span class="text-5xl block mb-2">🛡️</span>
      <h1 class="text-2xl font-black text-indigo-400">Tycoon Admin</h1>
      <p class="text-sm text-slate-400 mt-1">Authorized Personnel Only</p>
    </div>
    <div class="space-y-4">
      <input type="email" id="adminEmail" placeholder="Admin Email" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
      <input type="password" id="adminPassword" placeholder="Password" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
      <button onclick="loginAdmin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg transition shadow">Secure Login</button>
    </div>
  </div>

  <!-- Main Admin Dashboard -->
  <div id="adminDashboard" class="hidden max-w-6xl mx-auto space-y-6">
    
    <header class="flex justify-between items-end border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-3xl font-black text-indigo-400 flex items-center gap-3">
          <span>🛡️</span> Tycoon Control Center
        </h1>
        <p class="text-sm text-slate-400 mt-1">Manage cloud saves and player sessions.</p>
      </div>
      <div class="flex gap-3">
        <button onclick="fetchSaves()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">🔄 Refresh Data</button>
        <button onclick="logoutAdmin()" class="bg-rose-900/80 hover:bg-rose-800 border border-rose-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">Log Out</button>
      </div>
    </header>

    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left whitespace-nowrap">
          <thead class="bg-slate-900/80 text-slate-400 uppercase text-xs border-b border-slate-700">
            <tr>
              <th class="px-6 py-4 font-semibold">Player / Sponsor</th>
              <th class="px-6 py-4 font-semibold">Progress</th>
              <th class="px-6 py-4 font-semibold text-right">Net Portfolio</th>
              <th class="px-6 py-4 font-semibold text-center">Management Actions</th>
            </tr>
          </thead>
          <tbody id="playerTableBody" class="divide-y divide-slate-700/50">
            <!-- Data populates here -->
            <tr><td colspan="4" class="px-6 py-8 text-center text-slate-500 italic">Loading database...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- FIREBASE MODULAR SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDtr3ynB5L5iazf9gWZ-MGwjSZ1oAbsQ7M",
      authDomain: "tycoon-459c6.firebaseapp.com",
      projectId: "tycoon-459c6",
      storageBucket: "tycoon-459c6.firebasestorage.app",
      messagingSenderId: "336814910140",
      appId: "1:336814910140:web:8b5552fd38b0f3a1defeb9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Make functions globally available
    window.loginAdmin = async function() {
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPassword').value;
      if (!email || !pass) return alert("Enter credentials.");
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (error) {
        alert("Access Denied: " + error.message);
      }
    };

    window.logoutAdmin = async function() {
      await signOut(auth);
      location.reload();
    };

    window.fetchSaves = async function() {
      const tbody = document.getElementById('playerTableBody');
      tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-slate-400 animate-pulse">Querying database...</td></tr>';
      
      try {
        const querySnapshot = await getDocs(collection(db, "tycoon_saves"));
        if (querySnapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-slate-500">No game saves found in the database.</td></tr>';
          return;
        }

        let html = '';
        querySnapshot.forEach((docSnap) => {
          const id = docSnap.id;
          const data = docSnap.data();
          const netWorth = (data.checking || 0) + (data.short || 0) + (data.mid || 0) + (data.long || 0);
          
          html += `
            <tr class="hover:bg-slate-700/20 transition">
              <td class="px-6 py-4">
                <div class="font-bold text-white text-base">${data.playerName || "Unknown Guest"}</div>
                <div class="text-xs text-slate-500 mt-0.5">Sponsor: ${data.sponsorName || "N/A"} | UID: ${id.substring(0,6)}...</div>
              </td>
              <td class="px-6 py-4">
                <div class="text-sm font-medium text-emerald-400">Year ${data.day || 1} / 30</div>
                <div class="text-xs text-slate-500">Mode: ${data.gameMode || "unknown"}</div>
              </td>
              <td class="px-6 py-4 text-right">
                <div class="font-black text-white">$${netWorth.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
              </td>
              <td class="px-6 py-4 text-center space-x-2">
                <button onclick="triggerPasswordReset()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded text-xs font-semibold transition border border-slate-600">Email Reset</button>
                <button onclick="wipeGameSave('${id}', '${data.playerName}')" class="bg-amber-900/80 hover:bg-amber-800 text-amber-200 px-3 py-1.5 rounded text-xs font-semibold transition border border-amber-700">Wipe Save</button>
                <button onclick="deleteAccountAlert()" class="bg-rose-900/80 hover:bg-rose-800 text-rose-200 px-3 py-1.5 rounded text-xs font-semibold transition border border-rose-700">Delete Auth</button>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      } catch (error) {
        console.error(error);
        tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-rose-400 font-bold">Permission Denied. Check Firestore Rules.</td></tr>`;
      }
    };

    window.wipeGameSave = async function(uid, playerName) {
      if (confirm(`CRITICAL WARNING: Are you sure you want to completely erase the game save for ${playerName}? This cannot be undone.`)) {
        try {
          await deleteDoc(doc(db, "tycoon_saves", uid));
          alert(`Save file for ${playerName} deleted successfully.`);
          window.fetchSaves();
        } catch (e) {
          alert("Error deleting document: " + e.message);
        }
      }
    };

    window.triggerPasswordReset = async function() {
      const email = prompt("Enter the player's email address to send a password reset link:");
      if (email) {
        try {
          await sendPasswordResetEmail(auth, email);
          alert(`Password reset email successfully sent to ${email}`);
        } catch (e) {
          alert("Error: " + e.message);
        }
      }
    };

    window.deleteAccountAlert = function() {
      alert("SECURITY RESTRICTION:\n\nTo prevent hacking, Firebase does not allow web pages to delete other users' login credentials. \n\nTo delete their auth account:\n1. Wipe their save file here first.\n2. Go to your Firebase Console -> Authentication -> Users.\n3. Find their email and select 'Delete Account'.");
    };

    // Auth State Listener
    onAuthStateChanged(auth, (user) => {
      const loginGate = document.getElementById('adminLoginGate');
      const dashboard = document.getElementById('adminDashboard');
      
      if (user) {
        loginGate.classList.add('hidden');
        dashboard.classList.remove('hidden');
        window.fetchSaves();
      } else {
        loginGate.classList.remove('hidden');
        dashboard.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
