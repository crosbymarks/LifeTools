<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Photo Swap Puzzle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Puzzle Board Setup */
        .puzzle-board {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            position: relative;
            background-color: #1e293b;
            border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            border: 4px solid #334155;
        }

        /* Individual Tiles */
        .puzzle-tile {
            position: absolute;
            width: 25%;
            height: 25%;
            background-size: 400% 400%;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5), inset 0 0 4px rgba(0,0,0,0.3);
            cursor: grab;
            transition: top 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        left 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        box-shadow 0.2s, transform 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            z-index: 1;
            background-color: #334155;
        }

        .puzzle-tile:active { cursor: grabbing; }

        .puzzle-tile.cluster-hover {
            box-shadow: inset 0 0 0 3px #fbbf24, inset 0 0 15px rgba(251, 191, 36, 0.5);
            z-index: 5;
            transform: scale(0.98);
            filter: brightness(1.1);
        }

        .puzzle-tile.cluster-active {
            box-shadow: inset 0 0 0 4px #eab308, 0 0 20px rgba(234, 179, 8, 0.8);
            z-index: 10;
            transform: scale(0.95);
            filter: brightness(1.15) opacity(0.9);
        }

        .puzzle-tile.drag-target-valid {
            box-shadow: inset 0 0 0 4px #10b981, inset 0 0 20px rgba(16, 185, 129, 0.5);
            z-index: 8;
        }

        .puzzle-tile.drag-target-invalid {
            box-shadow: inset 0 0 0 4px #ef4444, inset 0 0 20px rgba(239, 68, 68, 0.5);
            z-index: 8;
        }

        /* Overlays */
        .game-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 20;
        }

        .game-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .screen { display: none; }
        .screen.active { display: flex; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center py-8 px-4 font-sans text-slate-800">

    <div class="max-w-lg w-full flex flex-col gap-6">
        
        <!-- App Header -->
        <div class="text-center">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Multiplayer Swap Puzzle</h1>
            <p id="appSubtitle" class="text-slate-600 mt-2 text-sm px-4">Loading connection...</p>
        </div>

        <!-- SCREEN: MENU -->
        <div id="screen-menu" class="screen flex-col gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <button id="btnCreateRoom" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition-colors active:scale-95">Create Room</button>
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-300"></div>
                <span class="flex-shrink-0 mx-4 text-slate-400 font-medium text-sm">OR</span>
                <div class="flex-grow border-t border-slate-300"></div>
            </div>
            <div class="flex gap-2">
                <input type="text" id="inputRoomCode" placeholder="Enter Room Code" class="flex-grow px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl font-bold text-center uppercase tracking-widest focus:ring-2 focus:ring-indigo-500 outline-none" maxlength="4">
                <button id="btnJoinRoom" class="px-6 py-3 bg-slate-800 text-white font-bold rounded-xl shadow-md hover:bg-slate-900 transition-colors active:scale-95">Join</button>
            </div>
        </div>

        <!-- SCREEN: LOBBY -->
        <div id="screen-lobby" class="screen flex-col gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center">
            <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl">
                <p class="text-sm text-indigo-600 font-semibold mb-1">ROOM CODE</p>
                <p id="displayRoomCode" class="text-4xl font-black text-indigo-900 tracking-widest uppercase">----</p>
            </div>

            <div id="lobbyStatus" class="text-sm font-medium text-slate-600 mt-2">Waiting for opponent...</div>

            <div id="hostControls" class="hidden flex-col gap-3 mt-2">
                <label class="relative flex justify-center items-center px-4 py-3 bg-indigo-600 text-white font-semibold rounded-xl shadow-md hover:bg-indigo-700 cursor-pointer transition-all active:scale-95">
                    <span>Upload Puzzle Photo</span>
                    <input type="file" id="imageUpload" accept="image/*" class="sr-only">
                </label>
                <p class="text-xs text-slate-500">Pick a photo to sync to the other player.</p>
            </div>

            <div id="readyControls" class="hidden flex-col gap-3 mt-4 pt-4 border-t border-slate-100">
                <img id="previewImage" class="w-24 h-24 object-cover mx-auto rounded-lg border-2 border-slate-200 shadow-sm" src="" alt="Puzzle Preview">
                <button id="btnReady" class="w-full py-3 bg-green-600 text-white font-bold rounded-xl shadow-md hover:bg-green-700 transition-colors active:scale-95">I'm Ready!</button>
            </div>
        </div>

        <!-- SCREEN: GAME -->
        <div id="screen-game" class="screen flex-col gap-4">
            
            <!-- Multiplayer HUD -->
            <div class="grid grid-cols-2 gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex flex-col items-center p-2 bg-indigo-50 rounded-lg">
                    <span class="text-xs font-bold text-indigo-400 uppercase">You</span>
                    <span class="text-2xl font-black text-indigo-900"><span id="myProgress">0</span><span class="text-sm text-indigo-400">/16</span></span>
                </div>
                <div class="flex flex-col items-center p-2 bg-rose-50 rounded-lg">
                    <span class="text-xs font-bold text-rose-400 uppercase">Opponent</span>
                    <span class="text-2xl font-black text-rose-900"><span id="oppProgress">0</span><span class="text-sm text-rose-400">/16</span></span>
                </div>
            </div>

            <!-- Puzzle Container -->
            <div class="puzzle-board mx-auto" id="puzzleBoard">
                
                <!-- Countdown Overlay -->
                <div id="countdownOverlay" class="game-overlay bg-slate-900/80">
                    <div id="countdownText" class="text-7xl font-black text-white drop-shadow-lg transform scale-150 transition-transform">3</div>
                </div>

                <!-- Win/Lose Overlay -->
                <div id="endOverlay" class="game-overlay">
                    <div class="bg-white/95 p-8 rounded-2xl shadow-2xl text-center transform scale-95 transition-transform duration-500 ease-out border" id="endCard">
                        <h2 id="endTitle" class="text-3xl font-black mb-2"></h2>
                        <p id="endSubtitle" class="text-slate-600 mb-6 font-medium"></p>
                        <button onclick="window.location.reload()" class="bg-slate-800 text-white px-8 py-3 rounded-xl font-bold hover:bg-slate-900 transition-colors shadow-lg shadow-slate-200">Leave Game</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden canvas for image processing & shrinking -->
    <canvas id="imageCanvas" class="hidden"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Initialization ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'photo-puzzle-multiplayer';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { /* Fallback config */ };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- State Variables ---
        let currentUser = null;
        let currentRoomCode = null;
        let isHost = false;
        let unsubscribeRoom = null;
        let roomDataCache = null;

        // Game State
        const GRID_SIZE = 4;
        const TOTAL_PIECES = GRID_SIZE * GRID_SIZE;
        let tiles = [];
        let gameActive = false;
        let hoveredTileObj = null;
        let selectedAnchorObj = null; 
        let draggedAnchorObj = null; 

        // --- DOM Elements ---
        const screens = {
            menu: document.getElementById('screen-menu'),
            lobby: document.getElementById('screen-lobby'),
            game: document.getElementById('screen-game')
        };
        const appSubtitle = document.getElementById('appSubtitle');

        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[screenName].classList.add('active');
        }

        // --- Auth Setup ---
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUser = auth.currentUser;
                appSubtitle.textContent = "Ready to play! Create or Join a room.";
                showScreen('menu');
            } catch (error) {
                appSubtitle.textContent = "Connection failed. Please refresh.";
                console.error("Auth Error:", error);
            }
        }
        initAuth();

        // --- Network / Lobby Logic ---

        document.getElementById('btnCreateRoom').addEventListener('click', async () => {
            if (!currentUser) return;
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoomCode = code;
            isHost = true;

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
            await setDoc(roomRef, {
                createdAt: Date.now(),
                hostId: currentUser.uid,
                guestId: null,
                status: 'waiting', // waiting, readying, playing, finished
                photoData: null,
                positions: null,
                hostReady: false,
                guestReady: false,
                hostProgress: 0,
                guestProgress: 0,
                winnerId: null
            });

            document.getElementById('displayRoomCode').textContent = code;
            document.getElementById('hostControls').classList.remove('hidden');
            showScreen('lobby');
            listenToRoom(code);
        });

        document.getElementById('btnJoinRoom').addEventListener('click', async () => {
            if (!currentUser) return;
            const code = document.getElementById('inputRoomCode').value.toUpperCase().trim();
            if (code.length !== 4) return alert("Enter a valid 4-letter code");

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
            const docSnap = await getDoc(roomRef);
            
            if (docSnap.exists() && docSnap.data().status === 'waiting' && !docSnap.data().guestId) {
                currentRoomCode = code;
                isHost = false;
                await updateDoc(roomRef, { guestId: currentUser.uid });
                
                document.getElementById('displayRoomCode').textContent = code;
                document.getElementById('hostControls').classList.add('hidden');
                showScreen('lobby');
                listenToRoom(code);
            } else {
                alert("Room not found or already full.");
            }
        });

        function listenToRoom(code) {
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
            unsubscribeRoom = onSnapshot(roomRef, (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();
                roomDataCache = data;
                
                // Lobby Updates
                const statusEl = document.getElementById('lobbyStatus');
                if (data.status === 'waiting') {
                    statusEl.textContent = data.guestId ? "Opponent joined! Waiting for photo upload..." : "Waiting for opponent to join...";
                    if (data.guestId && isHost) document.getElementById('hostControls').classList.remove('hidden');
                }

                // Photo synced
                if (data.photoData && data.status === 'waiting') {
                    statusEl.textContent = "Photo loaded! Ready up to start.";
                    document.getElementById('hostControls').classList.add('hidden');
                    document.getElementById('readyControls').classList.remove('hidden');
                    document.getElementById('previewImage').src = data.photoData;
                    
                    const imReady = isHost ? data.hostReady : data.guestReady;
                    const btnReady = document.getElementById('btnReady');
                    if (imReady) {
                        btnReady.textContent = "Waiting for Opponent...";
                        btnReady.disabled = true;
                        btnReady.classList.replace('bg-green-600', 'bg-slate-400');
                    } else {
                        btnReady.textContent = "I'm Ready!";
                        btnReady.disabled = false;
                        btnReady.classList.replace('bg-slate-400', 'bg-green-600');
                    }
                }

                // Readying Phase
                if (data.status === 'readying' && screens.lobby.classList.contains('active')) {
                    startLocalCountdown(data);
                }

                // Game Active Phase (sync progress)
                if (data.status === 'playing' || data.status === 'finished') {
                    const myProg = isHost ? data.hostProgress : data.guestProgress;
                    const oppProg = isHost ? data.guestProgress : data.hostProgress;
                    document.getElementById('myProgress').textContent = myProg;
                    document.getElementById('oppProgress').textContent = oppProg;
                }

                // Game Over
                if (data.status === 'finished' && gameActive) {
                    gameActive = false;
                    handleGameOver(data.winnerId);
                }
                
            }, (error) => {
                console.error("Room sync error:", error);
            });
        }

        // Host Uploads Image
        document.getElementById('imageUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file || !isHost) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = async () => {
                    // Force small size to easily fit Firestore 1MB limit
                    const TARGET_SIZE = 400; 
                    const canvas = document.getElementById('imageCanvas');
                    canvas.width = TARGET_SIZE;
                    canvas.height = TARGET_SIZE;
                    const ctx = canvas.getContext('2d');
                    
                    const size = Math.min(img.width, img.height);
                    const sx = (img.width - size) / 2;
                    const sy = (img.height - size) / 2;

                    ctx.clearRect(0, 0, TARGET_SIZE, TARGET_SIZE);
                    ctx.drawImage(img, sx, sy, size, size, 0, 0, TARGET_SIZE, TARGET_SIZE);

                    const base64Photo = canvas.toDataURL('image/jpeg', 0.8);
                    
                    // Generate shared shuffle positions
                    let positions = Array.from({length: TOTAL_PIECES}, (_, i) => ({
                        row: Math.floor(i / GRID_SIZE),
                        col: i % GRID_SIZE
                    }));
                    for (let i = positions.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [positions[i], positions[j]] = [positions[j], positions[i]];
                    }

                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
                    await updateDoc(roomRef, { 
                        photoData: base64Photo,
                        positions: positions
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Ready Button
        document.getElementById('btnReady').addEventListener('click', async () => {
            if (!currentUser || !currentRoomCode) return;
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
            
            const updateData = isHost ? { hostReady: true } : { guestReady: true };
            await updateDoc(roomRef, updateData);

            // Check if both are ready to trigger countdown
            if (isHost && roomDataCache.guestReady) {
                await updateDoc(roomRef, { status: 'readying' });
            } else if (!isHost && roomDataCache.hostReady) {
                await updateDoc(roomRef, { status: 'readying' });
            }
        });

        function startLocalCountdown(data) {
            showScreen('game');
            buildBoard(data.photoData, data.positions);
            
            const overlay = document.getElementById('countdownOverlay');
            const text = document.getElementById('countdownText');
            overlay.classList.add('active');
            
            let count = 3;
            text.textContent = count;
            
            const interval = setInterval(async () => {
                count--;
                if (count > 0) {
                    text.textContent = count;
                } else if (count === 0) {
                    text.textContent = "GO!";
                } else {
                    clearInterval(interval);
                    overlay.classList.remove('active');
                    gameActive = true;
                    if (isHost) {
                        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
                        await updateDoc(roomRef, { status: 'playing' });
                    }
                }
            }, 1000);
        }

        function handleGameOver(winnerId) {
            const endOverlay = document.getElementById('endOverlay');
            const endCard = document.getElementById('endCard');
            const title = document.getElementById('endTitle');
            const sub = document.getElementById('endSubtitle');

            const isWinner = currentUser.uid === winnerId;
            
            if (isWinner) {
                title.textContent = "You Won!";
                title.classList.add('text-green-600');
                sub.textContent = "Great puzzle solving skills.";
                endCard.classList.add('border-green-400');
            } else {
                title.textContent = "You Lost!";
                title.classList.add('text-rose-600');
                sub.textContent = "Your opponent finished first.";
                endCard.classList.add('border-rose-400');
            }

            endOverlay.classList.add('active');
            setTimeout(() => {
                endCard.classList.remove('scale-95');
                endCard.classList.add('scale-100');
            }, 100);
        }

        // --- Puzzle Core Logic ---

        function buildBoard(imageSrc, positions) {
            const board = document.getElementById('puzzleBoard');
            // Remove existing tiles but keep overlays
            Array.from(board.children).forEach(c => {
                if(c.classList.contains('puzzle-tile')) c.remove();
            });
            tiles = [];

            for (let i = 0; i < TOTAL_PIECES; i++) {
                const correctRow = Math.floor(i / GRID_SIZE);
                const correctCol = i % GRID_SIZE;
                
                const tile = document.createElement('div');
                tile.className = 'puzzle-tile';
                tile.draggable = true;
                tile.style.backgroundImage = `url(${imageSrc})`;
                
                const bgPosX = (correctCol / (GRID_SIZE - 1)) * 100;
                const bgPosY = (correctRow / (GRID_SIZE - 1)) * 100;
                tile.style.backgroundPosition = `${bgPosX}% ${bgPosY}%`;
                
                const tileObj = {
                    element: tile,
                    id: i,
                    correctRow: correctRow,
                    correctCol: correctCol,
                    currentRow: positions[i].row,
                    currentCol: positions[i].col
                };
                
                updateTileDOMPosition(tileObj);
                setupTileInteractions(tileObj);
                
                tiles.push(tileObj);
                board.appendChild(tile);
            }
        }

        function updateTileDOMPosition(tileObj) {
            tileObj.element.style.top = `${tileObj.currentRow * 25}%`;
            tileObj.element.style.left = `${tileObj.currentCol * 25}%`;
        }

        function getTileAt(row, col) {
            return tiles.find(t => t.currentRow === row && t.currentCol === col);
        }

        function isRelativelyCorrect(t1, t2) {
            if (!t1 || !t2) return false;
            return (t1.correctRow - t2.correctRow === t1.currentRow - t2.currentRow) &&
                   (t1.correctCol - t2.correctCol === t1.currentCol - t2.currentCol);
        }

        function getCluster(startTile) {
            if (!startTile) return [];
            let cluster = [];
            let queue = [startTile];
            let visited = new Set();
            visited.add(startTile.id);

            while (queue.length > 0) {
                let curr = queue.shift();
                cluster.push(curr);

                const neighbors = [
                    getTileAt(curr.currentRow - 1, curr.currentCol),
                    getTileAt(curr.currentRow + 1, curr.currentCol),
                    getTileAt(curr.currentRow, curr.currentCol - 1),
                    getTileAt(curr.currentRow, curr.currentCol + 1)
                ];

                for (let n of neighbors) {
                    if (n && !visited.has(n.id) && isRelativelyCorrect(curr, n)) {
                        visited.add(n.id);
                        queue.push(n);
                    }
                }
            }
            return cluster;
        }

        function isValidMove(cluster, deltaRow, deltaCol) {
            for (let t of cluster) {
                let dstR = t.currentRow + deltaRow;
                let dstC = t.currentCol + deltaCol;
                if (dstR < 0 || dstR >= GRID_SIZE || dstC < 0 || dstC >= GRID_SIZE) return false;
            }
            return true;
        }

        function updateHighlights() {
            if (!gameActive) return;
            tiles.forEach(t => t.element.classList.remove('cluster-hover', 'cluster-active'));
            
            let activeCluster = [];
            if (draggedAnchorObj) activeCluster = getCluster(draggedAnchorObj);
            else if (selectedAnchorObj) activeCluster = getCluster(selectedAnchorObj);

            activeCluster.forEach(t => t.element.classList.add('cluster-active'));

            if (hoveredTileObj && !activeCluster.includes(hoveredTileObj)) {
                getCluster(hoveredTileObj).forEach(t => t.element.classList.add('cluster-hover'));
            }
        }

        function setupTileInteractions(tileObj) {
            const el = tileObj.element;

            el.addEventListener('mouseenter', () => { hoveredTileObj = tileObj; updateHighlights(); });
            el.addEventListener('mouseleave', () => { if (hoveredTileObj === tileObj) hoveredTileObj = null; updateHighlights(); });

            el.addEventListener('click', (e) => {
                if (!gameActive || draggedAnchorObj) return;
                if (!selectedAnchorObj) {
                    selectedAnchorObj = tileObj;
                    updateHighlights();
                } else {
                    if (!getCluster(selectedAnchorObj).includes(tileObj)) {
                        const dr = tileObj.currentRow - selectedAnchorObj.currentRow;
                        const dc = tileObj.currentCol - selectedAnchorObj.currentCol;
                        performClusterSwap(selectedAnchorObj, dr, dc);
                    }
                    selectedAnchorObj = null;
                    updateHighlights();
                }
            });

            el.addEventListener('dragstart', (e) => {
                if (!gameActive) { e.preventDefault(); return; }
                selectedAnchorObj = null;
                draggedAnchorObj = tileObj;
                updateHighlights();
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', tileObj.id);
                const transparentImg = new Image();
                transparentImg.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
                e.dataTransfer.setDragImage(transparentImg, 0, 0);
            });

            el.addEventListener('dragover', (e) => {
                if (!gameActive) return;
                e.preventDefault(); 
                e.dataTransfer.dropEffect = 'move';
                if (draggedAnchorObj && !getCluster(draggedAnchorObj).includes(tileObj)) {
                    const dr = tileObj.currentRow - draggedAnchorObj.currentRow;
                    const dc = tileObj.currentCol - draggedAnchorObj.currentCol;
                    const cluster = getCluster(draggedAnchorObj);
                    
                    if (isValidMove(cluster, dr, dc)) {
                        el.classList.add('drag-target-valid');
                        el.classList.remove('drag-target-invalid');
                    } else {
                        el.classList.add('drag-target-invalid');
                        el.classList.remove('drag-target-valid');
                    }
                }
            });

            el.addEventListener('dragleave', (e) => el.classList.remove('drag-target-valid', 'drag-target-invalid'));

            el.addEventListener('drop', (e) => {
                if (!gameActive) return;
                e.stopPropagation();
                el.classList.remove('drag-target-valid', 'drag-target-invalid');
                
                if (draggedAnchorObj && !getCluster(draggedAnchorObj).includes(tileObj)) {
                    const dr = tileObj.currentRow - draggedAnchorObj.currentRow;
                    const dc = tileObj.currentCol - draggedAnchorObj.currentCol;
                    performClusterSwap(draggedAnchorObj, dr, dc);
                }
            });

            el.addEventListener('dragend', (e) => {
                draggedAnchorObj = null;
                tiles.forEach(t => t.element.classList.remove('drag-target-valid', 'drag-target-invalid'));
                updateHighlights();
            });
        }

        async function performClusterSwap(anchorObj, deltaRow, deltaCol) {
            if (deltaRow === 0 && deltaCol === 0) return;
            const cluster = getCluster(anchorObj);
            
            if (!isValidMove(cluster, deltaRow, deltaCol)) return;

            let nextGrid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
            let displaced = [];
            let clusterIds = new Set(cluster.map(t => t.id));

            for (let t of cluster) nextGrid[t.currentRow + deltaRow][t.currentCol + deltaCol] = t;

            for (let t of tiles) {
                if (!clusterIds.has(t.id)) {
                    if (nextGrid[t.currentRow][t.currentCol] === null) nextGrid[t.currentRow][t.currentCol] = t;
                    else displaced.push(t);
                }
            }

            for (let t of displaced) {
                let checkR = t.currentRow - deltaRow;
                let checkC = t.currentCol - deltaCol;
                while (true) {
                    if (checkR < 0 || checkR >= GRID_SIZE || checkC < 0 || checkC >= GRID_SIZE) break; 
                    if (nextGrid[checkR][checkC] === null) {
                        nextGrid[checkR][checkC] = t;
                        break;
                    }
                    checkR -= deltaRow;
                    checkC -= deltaCol;
                }
            }

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let t = nextGrid[r][c];
                    if (t) {
                        t.currentRow = r;
                        t.currentCol = c;
                        updateTileDOMPosition(t);
                    }
                }
            }

            updateHighlights();
            checkProgress();
        }

        async function checkProgress() {
            if (!gameActive || !currentUser) return;
            
            let correctCount = 0;
            tiles.forEach(t => {
                if (t.currentRow === t.correctRow && t.currentCol === t.correctCol) correctCount++;
            });

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
            const updateData = isHost ? { hostProgress: correctCount } : { guestProgress: correctCount };
            
            // Check Win Condition locally first to instantly freeze interactions
            if (correctCount === TOTAL_PIECES) {
                gameActive = false;
                updateData.status = 'finished';
                updateData.winnerId = currentUser.uid;
            }

            await updateDoc(roomRef, updateData);
        }
    </script>
